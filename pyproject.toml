[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprint-forecast"
version = "1.0.0"
description = "Machine learning model that predicts whether a Scrum sprint will deliver its commitment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Victor Olaitan" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "matplotlib>=3.8", "joblib>=1.3"]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]

[project.scripts]
sprint-forecast = "sprint_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
