name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: Train and forecast end to end
        run: |
          sprint-forecast train --model-dir models
          sprint-forecast predict --committed 36 --history 30,34,31 --team-size 5 --leave-days 4
